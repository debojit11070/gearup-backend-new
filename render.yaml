services:
  - type: web
    name: gearup-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        value: postgresql+psycopg2://neondb_owner:npg_y7BWfFPbNw4c@ep-soft-feather-axqealfz-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: http://localhost:3000
      - key: ADMIN_SEED_EMAIL
        value: admin@gearup.com
      - key: ADMIN_SEED_PASSWORD
        value: Admin@12345
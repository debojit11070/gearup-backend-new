services:
  - type: web
    name: gearup-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "./render-build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PIP_NO_BUILD_ISOLATION
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: http://localhost:3000
      - key: ADMIN_SEED_EMAIL
        value: admin@gearup.com
      - key: ADMIN_SEED_PASSWORD
        value: Admin@12345